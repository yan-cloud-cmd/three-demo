<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>藏羚羊迁徙可视化</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden; height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: #333;
    }
    #pointListContainer {
      position: fixed;
      top: 20px;
      left: 20px;
      max-height: 80vh;
      width: 220px;
      overflow-y: auto;
      background: rgba(255 255 255 / 0.9);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      z-index: 10;
    }
    #pointList {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }
    #pointList li {
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      transition: background-color 0.2s ease;
    }
    #pointList li:hover {
      background-color: #ffd9a8;
    }
    #pointDetail {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
      min-height: 36px;
      line-height: 1.3;
    }

    #toggleDirection, #toggleFollow {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 14px;
      background-color: rgba(255, 255, 255, 0.85);
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      z-index: 20;
      transition: background-color 0.2s ease;
      user-select: none;
    }
    #toggleDirection {
      top: 60px;
    }
    #toggleDirection:hover, #toggleFollow:hover {
      background-color: #ffe0b3;
    }
  </style>
  <script type="module" crossorigin src="/three-demo/assets/index-C2XfmsiM.js"></script>
</head>
<body>
  <div id="pointListContainer">
    <ul id="pointList"></ul>
    <div id="pointDetail">点击标记查看介绍</div>
  </div>
  <button id="toggleFollow">开启相机跟随</button>
  <button id="toggleDirection">切换方向：往</button>

</body>
</html>
